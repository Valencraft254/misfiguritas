<div class="stats">
Completadas: <span id="completadas">0</span> |
Total: <span id="total">980</span> |
Porcentaje: <span id="porcentaje">0%</span>
</div>

<div id="lista"></div>

</div>

<script>
function actualizarPorcentaje() {
    const completadas = parseInt(document.getElementById("completadas").textContent) || 0;
    const porcentaje = ((completadas / 980) * 100).toFixed(1);
    document.getElementById("porcentaje").textContent = porcentaje + "%";
}

const observer = new MutationObserver(() => {
    actualizarPorcentaje();
});

observer.observe(document.getElementById("completadas"), {
    childList: true,
    characterData: true,
    subtree: true
});

actualizarPorcentaje();
</script>
