<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MisFiguritas</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="contenedor">

<h1>⚽ MisFiguritas</h1>

<input
id="buscar"
type="text"
placeholder="🔎 Buscar jugador o número"
>

<div class="agregar">

<input
id="numero"
type="text"
placeholder="Número"
>

<input
id="nombre"
type="text"
placeholder="Nombre del jugador"
>

<button id="agregarBtn">

➕ Agregar figurita

</button>

</div>

<div class="stats">

Completadas:
<span id="completadas">
0
</span>

|

Total:
<span id="total">
0
</span>

</div>

<div id="lista"></div>

</div>

<script src="script.js"></script>

</body>
</html>
